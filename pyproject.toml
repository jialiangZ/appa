[project]
name = "appa"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "bottleneck==1.6.0",
  "dask==2026.8.0",
  "einops==0.8.2",
  "gcsfs==2026.10.0",
  "heavyball==3.2.1",
  "hydra-core==1.3.7",
  "h5py==3.16.0",
  "lightning==2.6.6",
  "numcodecs==0.17.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "swanlab==0.10.1",
  "torch==2.11.0",
  "torch-harmonics==0.9.2",
  "torchvision==0.26.0",
  "tqdm==4.70.1",
  "xarray==2026.9.0",
  "xformers==0.0.35",
  "zarr==3.4.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.scripts]
appa = "appa.launchers:main"

[project.optional-dependencies]
all = [
  "cmocean==4.0.3",
  "dawgz==1.0.4",
  "jupyterlab==4.6.4",
  "ipykernel==7.4.0",
  "matplotlib==3.11.2",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "wandb==0.30.0",
]

# PyTorch wheels bundled with CUDA 12.9 (the newest CUDA 12 variant; CUDA 13
# builds require an NVIDIA driver >= 580). Only torch and torchvision are
# sourced from this index: xformers publishes compatible wheels on PyPI.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 99

[tool.ruff.lint]
extend-select = ["B", "I", "W"]
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
section-order = ["future", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
preview = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["appa*", "experiments*"]
