name: "cae_f${.resize}c${.lat_channels}"
shape: [121, 240]
resize: 8
saturation: "softclip2"
noise_level: 0.01
lat_channels: 128
# Depth must satisfy resize == 2^(len(hid_blocks)-1): 4 stages -> /8
hid_channels: [128, 256, 384, 512]
hid_blocks: [3, 3, 3, 3]
pixel_shuffle: true
ffn_factor: 1
dropout: 0.0
patch_size: [1, 1]
checkpointing: false
identity_init: true
