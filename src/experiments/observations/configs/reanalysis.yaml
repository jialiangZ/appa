model_path: ???
model_target: last  # Options: best, last

diffusion:
  num_steps: 32  # Defaults to model's validation denoising steps
  mmps_iters: 2
  sampler:
    type: pc
    config:
      delta: 0.1
      corrections: 2

# Physical grid the AE decodes to. Satellite indices are remapped from the
# native 1440x721 grid; station masks must be pre-resampled accordingly
# (ground_masks/mask_11k_lr240.pt).
target_grid: [121, 240]

assimilation_lengths: "1,2,4,8,16"

observed_variables:
  stations:
    enabled: true
    low: 0
    high: 5  # included
  satellites:
    enabled: true
    low: 6
    high: 70  # included

masks:
  - name: leo
    type: satellite
    covariance: 1e-2
    config:
      orbital_altitude: 800
      inclination: 75
      initial_phase: 0
      obs_freq: 60
      fov: 5
  - name: weather11k
    type: stations
    covariance: 1e-4
    config:
      num_stations: 11k_lr240
      num_valid_stations: 0

# Samples for a given window size
num_samples_per_date: 2
start_dates:
  - "2017-04-01 0h"

blanket_overlap: 12  # Overlap between blankets

precision: float16  # Options: float32, float16, bfloat16, null = model training precision

hardware:
  backend: async  # or slurm
  account: users
  gpus_per_node: 1
  gen:
    cpus: 8
    ram: 60GB
    time: "4:00:00"
    partition: gpu
    gpus: 1
  aggregate:
    cpus: 8
    gpus: 0
    ram: 60GB
    time: "2:00"
    partition: gpu
